name: Rollback main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.ROLLBACK_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Benno111"
          git config user.email "80102205+Benno111@users.noreply.github.com"

      - name: Verify target commit
        run: |
          git cat-file -e fce7d07^{commit}

      - name: Reset main
        run: |
          git reset --hard fce7d07

      - name: Force push main
        env:
          GH_TOKEN: ${{ secrets.ROLLBACK_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin HEAD:main --force
